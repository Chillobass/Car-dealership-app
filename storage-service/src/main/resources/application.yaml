server:
  port: 8082
spring:
  application:
    name: storage-service
  datasource:
    url: jdbc:postgresql://postgres:5432/storage_db
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  liquibase:
    change-log: classpath:db/db.changelog-master.xml
    enabled: true
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/car-realm
          jwk-set-uri: ${KC_JWK_SET_URI:http://keycloak:8080/realms/car-realm/protocol/openid-connect/certs}

  logging:
    level:
      org.springframework.security: DEBUG
    pattern:
      level: "[%X{traceId}] %-5level"

management:
  tracing:
    sampling:
      probability: 1.0

grpc:
  server:
    port: 9090
    enable-keep-alive: true
    keep-alive-time: 30s
    keep-alive-timeout: 5s